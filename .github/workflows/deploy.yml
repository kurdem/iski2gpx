name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kurdem/iski2gpx
  RESOURCE_GROUP: rg-iski2gpx
  CONTAINER_APP: iski2gpx

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Prüfen, ob Image öffentlich abrufbar ist
        run: |
          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:kurdem/iski2gpx:pull" | jq -r .token)
          if ! curl -fsS -o /dev/null \
               -H "Authorization: Bearer $TOKEN" \
               -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json" \
               "https://ghcr.io/v2/kurdem/iski2gpx/manifests/${{ github.sha }}"; then
            echo "::error::ghcr.io/kurdem/iski2gpx ist nicht öffentlich. Einmalig: https://github.com/users/kurdem/packages/container/iski2gpx/settings -> Danger Zone -> Change visibility -> Public. Danach Workflow erneut starten."
            exit 1
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy auf Azure Container Apps
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" \
            --only-show-errors -o none
          FQDN=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "### Deployed: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$FQDN"

      - name: Smoke-Test
        run: |
          FQDN=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for _ in $(seq 1 12); do
            if curl -fsS "https://$FQDN/health" | grep -q ok; then echo "health ok"; exit 0; fi
            sleep 10
          done
          echo "::error::Health-Check fehlgeschlagen"; exit 1
